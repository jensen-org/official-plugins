name: governance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop to promote into main
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "$HEAD_REF" = "develop"
