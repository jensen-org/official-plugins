name: plugins

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every plugin is documented and addressable
        run: |
          shopt -s nullglob
          fail=0
          for pkg in plugins/*/package.json; do
            dir="$(dirname "$pkg")"
            name="$(basename "$dir")"
            if [ ! -f "$dir/README.md" ]; then
              echo "::error file=$pkg::$name has no README.md; the plugin detail view has nothing to show"
              fail=1
            fi
            repo="$(jq -r '.jensen.repo // ""' "$pkg")"
            if [ "$repo" != "jensen-org/official-plugins" ]; then
              echo "::error file=$pkg::$name points at '$repo'; plugins in this monorepo release from jensen-org/official-plugins"
              fail=1
            fi
            tag="$(jq -r '.jensen.tag // ""' "$pkg")"
            version="$(jq -r '.version' "$pkg")"
            if [ "$tag" != "$name-v$version" ]; then
              echo "::error file=$pkg::$name declares tag '$tag'; the monorepo convention is '$name-v$version'"
              fail=1
            fi
            if [ -z "$(jq -r '.jensen.id // ""' "$pkg")" ]; then
              echo "::error file=$pkg::$name has no jensen.id"
              fail=1
            fi
          done
          exit $fail

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/images-tools/backend
      - name: Build and test every plugin that builds
        run: |
          for pkg in plugins/*/package.json; do
            dir="$(dirname "$pkg")"
            jq -e '.scripts.build' "$pkg" >/dev/null || continue
            (cd "$dir" && bun install && bun run build && bun run test)
          done
